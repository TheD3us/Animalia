<div
  class="star-rating"
>
  <ng-container *ngFor="let s of stars">
    <button
      type="button"
      class="star-btn"
      [class.filled]="isFilled(s)"
      [attr.aria-checked]="isFilled(s)"
      [attr.aria-label]="'Donner ' + s + ' étoiles'"
      role="radio"
      [attr.tabindex]="readonly ? -1 : 0"
      (mouseenter)="onMouseEnter(s)"
      (mouseleave)="onMouseLeave()"
      (click)="setValue(s)"
      [style.fontSize]="size"
      [attr.data-index]="s"
    >
      <!-- SVG étoile (rempli ou contour via CSS) -->
      <svg class="star" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.402 8.17L12 18.896 4.664 23.167l1.402-8.17L.132 9.21l8.2-1.192z"
        />
      </svg>
    </button>
  </ng-container>
</div>
